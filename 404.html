<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membuka undangan...</title></head><body style="background:#080808;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:20vh 20px"><p>Membuka undangan personal...</p><script>
(function(){
  var base='/the-wedding-of-angga-risma/';
  var path=location.pathname;
  var guest=path.indexOf(base)===0?path.slice(base.length).split('/').filter(Boolean)[0]:'';
  if(!guest){location.replace(base);return;}
  location.replace(base+'?to='+encodeURIComponent(decodeURIComponent(guest)));
})();
</script></body></html>
